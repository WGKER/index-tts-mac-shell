name: Build Mac App 版本01
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout shell code
        uses: actions/checkout@v4

      - name: Clone official IndexTTS
        run: |
          git clone https://github.com/index-tts/index-tts.git index-tts
          cd index-tts
          git lfs install
          git lfs pull

      - name: Setup uv & python
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          cd index-tts
          uv sync --default-index https://mirrors.aliyun.com/pypi/simple

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Electron dependencies
        run: npm install

      - name: Build Mac arm64 App
        run: npm run pack

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IndexTTS-Mac-arm64
          path: dist/*.zip
