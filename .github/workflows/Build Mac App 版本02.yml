name: Build Mac App 版本02
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout shell code
        uses: actions/checkout@v4

      - name: Clone official IndexTTS
        run: |
          git clone https://github.com/index-tts/index-tts.git index-tts
          cd index-tts
          git lfs install
          git lfs pull

      - name: Setup uv & python (CI预编译venv)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          cd index-tts
          uv sync --default-index https://mirrors.aliyun.com/pypi/simple
          # 验证venv生成成功
          ls -la .venv/bin/python
          .venv/bin/python --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: npm install

      - name: 打包前校验venv
        run: |
          echo "=== index-tts目录 ==="
          ls -la index-tts
          echo "=== venv python路径 ==="
          ls -la index-tts/.venv/bin/python

      - name: Build mac app
        run: npm run pack

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IndexTTS-Launcher-Mac-arm64
          path: dist/*.zip
