name: Build Mac App 版本02
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout shell code
        uses: actions/checkout@v4

      - name: Clone official IndexTTS
        run: |
          git clone https://github.com/index-tts/index-tts.git index-tts
          cd index-tts
          git lfs install
          git lfs pull

      - name: Setup uv & python
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          cd index-tts
          uv sync --default-index https://mirrors.aliyun.com/pypi/simple

      - name: Download uv binary for apple silicon
        run: |
          curl -LsSf https://github.com/astral-sh/uv/releases/latest/download/uv-aarch64-apple-darwin.tar.gz -o uv.tar.gz
          tar -zxf uv.tar.gz
          mv uv-aarch64-apple-darwin/uv .
          chmod +x ./uv
          ls -la ./uv
          rm -rf uv-aarch64-apple-darwin uv.tar.gz

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: |
          npm install

      - name: Check files before build
        run: |
          echo "=== 当前目录清单 ==="
          ls -la
          echo "=== uv 信息 ==="
          ls -la uv
          echo "=== index-tts 目录 ==="
          ls -la index-tts

      - name: Build mac app
        run: |
          npm run pack

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: IndexTTS-Launcher-Mac-arm64
          path: dist/*.zip
